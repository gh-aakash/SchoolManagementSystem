name: Deploy SchoolOS

on:
  push:
    branches:
      - v2-development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/SchoolManagementSystem
            
            # 1. Update Code
            echo "Pulling latest stable code..."
            git fetch origin
            git reset --hard origin/v2-development
            
            # 2. Re-launch Containers
            echo "🚀 Rebuilding containers..."
            sudo docker compose down
            sudo docker compose up -d --build --force-recreate
            
            # 3. Intelligent Health Verification
            echo "⏱️ Waiting for services to stabilize (up to 2 minutes)..."
            
            # Get expected service count from docker-compose.yml
            EXPECTED_COUNT=$(grep -c "^  [a-zA-Z0-9_-]\+:" docker-compose.yml)
            echo "📌 Expecting $EXPECTED_COUNT healthy services."
            
            MAX_RETRIES=12
            RETRY_COUNT=0
            HEALTHY=false
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "🔍 Checking health (Attempt $((RETRY_COUNT+1))/$MAX_RETRIES)..."
              sleep 10
              
              RUNNING=$(sudo docker compose ps --format json | grep -c "running" || true)
              UNHEALTHY=$(sudo docker compose ps --format json | grep -c "unhealthy" || true)
              
              if [ "$RUNNING" -eq "$EXPECTED_COUNT" ] && [ "$UNHEALTHY" -eq "0" ]; then
                echo "🟢 Success! All $EXPECTED_COUNT services are healthy."
                HEALTHY=true
                break
              fi
              
              echo "⚠️ Current State: $RUNNING/$EXPECTED_COUNT running, $UNHEALTHY unhealthy."
              RETRY_COUNT=$((RETRY_COUNT+1))
            done
            
            if [ "$HEALTHY" = false ]; then
              echo "🔴 ERROR: System failed to reach 100% health in time."
              echo "📜 DUMPING RECENT LOGS FOR DEBUGGING:"
              sudo docker compose logs --tail=50
              exit 1
            fi
            
            # 4. Cleanup
            sudo docker image prune -f
