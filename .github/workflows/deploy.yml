name: Deploy SchoolOS

on:
  push:
    branches:
      - v2-development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/SchoolManagementSystem
            
            # 1. Update Code
            echo "Pulling latest stable code..."
            git fetch origin
            git reset --hard origin/v2-development
            
            # 2. Re-launch Containers
            echo "Building production-grade containers via esbuild..."
            sudo docker compose down
            # Using --force-recreate to ensure the new esbuild-packed containers are used
            sudo docker compose up -d --build --force-recreate
            
            # 3. Verification Check (No Fake Green fix)
            echo "Waiting for stabilization..."
            sleep 20
            
            # Check for container health
            UNHEALTHY=$(sudo docker compose ps --format json | grep -c "unhealthy" || true)
            RUNNING=$(sudo docker compose ps --format json | grep -c "running" || true)
            
            if [ "$UNHEALTHY" -gt "0" ]; then
              echo "🔴 ERROR: Detected $UNHEALTHY unhealthy containers."
              sudo docker compose ps
              exit 1
            fi
            
            if [ "$RUNNING" -lt "7" ]; then
              echo "🔴 ERROR: Only $RUNNING/7 containers are running."
              sudo docker compose ps
              exit 1
            fi
            
            echo "🟢 Deployment successful! All 7 services are running and healthy."
            
            # 4. Cleanup
            sudo docker image prune -f
