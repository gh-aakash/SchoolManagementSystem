version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - IDENTITY_SERVICE_URL=http://identity:8001
      - SIS_SERVICE_URL=http://sis:8002
      - FINANCE_SERVICE_URL=http://finance:8003
      - ENGAGEMENT_SERVICE_URL=http://engagement:8004
      - ACADEMIC_SERVICE_URL=http://academic:8005
    networks:
      - schoolos-network
    depends_on:
      - identity
      - sis
      - finance
      - engagement
      - academic

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      - PORT=8001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - schoolos-network

  sis:
    build:
      context: .
      dockerfile: services/sis/Dockerfile
    environment:
      - PORT=8002
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - schoolos-network

  finance:
    build:
      context: .
      dockerfile: services/finance/Dockerfile
    environment:
      - PORT=8003
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    networks:
      - schoolos-network

  engagement:
    build:
      context: .
      dockerfile: services/engagement/Dockerfile
    environment:
      - PORT=8004
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - schoolos-network

  academic:
    build:
      context: .
      dockerfile: services/academic/Dockerfile
    environment:
      - PORT=8005
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - schoolos-network

networks:
  schoolos-network:
    driver: bridge
