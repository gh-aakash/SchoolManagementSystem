services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.system
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - IDENTITY_SERVICE_URL=http://identity:8001
      - SIS_SERVICE_URL=http://sis:8002
      - FINANCE_SERVICE_URL=http://finance:8003
      - ENGAGEMENT_SERVICE_URL=http://engagement:8004
      - ACADEMIC_SERVICE_URL=http://academic:8005
    command: [ "npm", "start", "--prefix", "gateway" ]
    networks:
      - schoolos-network
    depends_on:
      identity:
        condition: service_healthy
      sis:
        condition: service_healthy
      finance:
        condition: service_healthy
      engagement:
        condition: service_healthy
      academic:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 10s
      retries: 5

  identity:
    build:
      context: .
      dockerfile: Dockerfile.system
    environment:
      - PORT=8001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    command: [ "npm", "start", "--prefix", "services/identity" ]
    networks:
      - schoolos-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 15s
      timeout: 10s
      retries: 5

  sis:
    build:
      context: .
      dockerfile: Dockerfile.system
    environment:
      - PORT=8002
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    command: [ "npm", "start", "--prefix", "services/sis" ]
    networks:
      - schoolos-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 15s
      timeout: 10s
      retries: 5

  finance:
    build:
      context: .
      dockerfile: Dockerfile.system
    environment:
      - PORT=8003
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    command: [ "npm", "start", "--prefix", "services/finance" ]
    networks:
      - schoolos-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 15s
      timeout: 10s
      retries: 5

  engagement:
    build:
      context: .
      dockerfile: Dockerfile.system
    environment:
      - PORT=8004
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    command: [ "npm", "start", "--prefix", "services/engagement" ]
    networks:
      - schoolos-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8004/health" ]
      interval: 15s
      timeout: 10s
      retries: 5

  academic:
    build:
      context: .
      dockerfile: Dockerfile.system
    environment:
      - PORT=8005
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    command: [ "npm", "start", "--prefix", "services/academic" ]
    networks:
      - schoolos-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8005/health" ]
      interval: 15s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - GATEWAY_URL=http://gateway:8000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    networks:
      - schoolos-network
    depends_on:
      gateway:
        condition: service_healthy

networks:
  schoolos-network:
    driver: bridge
